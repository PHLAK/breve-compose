services:

  breve:
    image: phlak/breve:${BREVE_VERSION:-latest}
    env_file: environment.d/breve.env
    user: ${HOST_USER_ID:-www-data}:${HOST_GROUP_ID:-www-data}
    ports:
      - ${BREVE_PORT:-8076}:80
    volumes:
      - ${BREVE_DATA_PATH:-./data}:/var/www/html/data
      - ${BREVE_THEME_PATH:-./themes}:/var/www/html/themes
      - ${BREVE_CACHE_VOLUME:-breve-cache}:/var/www/html/cache/app
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped

  watchtower:
    image: nickfedor/watchtower:${WATCHTOWER_VERSION:-latest}
    env_file: environment.d/watchtower.env
    environment:
      WATCHTOWER_SCOPE: ${COMPOSE_PROJECT_NAME}
    volumes:
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - /etc/localtime:/etc/localtime:ro
    labels:
      com.centurylinklabs.watchtower.scope: ${COMPOSE_PROJECT_NAME}
    restart: unless-stopped

volumes:
  breve-cache: {}
